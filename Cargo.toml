[package]
name = "ui_embassy_main"
version = "0.1.0"
edition = "2021"

[dependencies]
# ==========================================
# UI & Core Libraries (no_std mode)
# ==========================================
ratatui = { version = "0.30.0", default-features = false }
embedded-graphics = "0.8.1"
# mousefood = { path = "../../../mousefood-main/mousefood-main/mousefood", default-features = false }
mousefood = { version = "0.5.0", default-features = false }
anyhow = { version = "1.0.81", default-features = false }

# ==========================================
# Display Driver
# ==========================================
ssd1306 = "0.9.0" 

# ==========================================
# Embassy Framework (Using Latest Git Master)
# ==========================================
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", features = ["tick-hz-1_000_000", "defmt"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", features = ["defmt"] }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "stm32g474re", "time-driver-any", "exti", "unstable-pac", "memory-x", "single-bank"] }

# ==========================================
# Hardware Logging & Panic Handling
# ==========================================
defmt = "0.3.5"
defmt-rtt = "0.4.0"
panic-probe = { version = "0.3.1", features = ["print-defmt"] }
# FIX: Added "critical-section-single-core" to resolve the linker error
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"
embedded-alloc = "0.5.1"

[profile.dev]
panic = "abort"
debug = true

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
