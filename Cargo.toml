[package]
name = "ui_embassy_main"
version = "0.1.0"
edition = "2021"

[dependencies]
# ==========================================
# UI & Core Libraries (no_std mode)
# ==========================================
ratatui = { version = "0.30.0", default-features = false }
embedded-graphics = { version = "0.8.1", features = ["defmt"] }
# MAX'S FEEDBACK: Include fonts and blink features for UI elements
mousefood = { path = "../../../mousefood-main/mousefood-main/mousefood", default-features = false, features = ["fonts", "blink"] }
anyhow = { version = "1.0.81", default-features = false }
heapless = { version = "0.9.2", default-features = false, features = ["defmt"] } # MAX'S FEEDBACK: Safe, no-alloc collections for AppState

# ==========================================
# Display Driver
# ==========================================
# MAX'S FEEDBACK: Switch to async display driver for non-blocking rendering
oled_async = "0.2.0"
display-interface-i2c = "0.5.0"

# ==========================================
# Embassy Framework (Using Latest Git Master)
# ==========================================
# FIX: 'platform-cortex-m' changed to 'arch-cortex-m' in latest Embassy git
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", features = ["tick-hz-1_000_000", "defmt"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", features = ["defmt"] }
# FIX: Added 'rt' feature for interrupt bindings
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "stm32g474re", "time-driver-any", "exti", "unstable-pac", "memory-x", "single-bank", "rt"] }

# ==========================================
# Hardware Logging, Memory & Panic Handling
# ==========================================
defmt = "0.3.5"
defmt-rtt = "0.4.0"
panic-probe = { version = "0.3.1", features = ["print-defmt"] }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"

# MAX'S FEEDBACK: Global allocator required for Ratatui's dynamic layout rendering
embedded-alloc = "0.5.1"

[profile.dev]
panic = "abort"
debug = true

[profile.release]
panic = "abort"
lto = true
opt-level = "s"