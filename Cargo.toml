[package]
name = "ui_embassy_main"
version = "0.1.0"
edition = "2021"

[dependencies]
# ==========================================
# UI & Core Libraries (no_std mode)
# ==========================================
ratatui = { version = "0.30.0", default-features = false }
embedded-graphics = "0.8.1"
mousefood = { path = "../../../mousefood-main/mousefood-main/mousefood", default-features = false }
anyhow = { version = "1.0.81", default-features = false }

# ==========================================
# Embassy Framework (Bare-metal mode)
# ==========================================
embassy-executor = { version = "0.5.0", default-features = false, features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.3.0", default-features = false, features = ["tick-hz-1_000_000"] }
# MAX'S FIX: Bumped embassy-sync to 0.6.0 to get access to the `Watch` module!
embassy-sync = { version = "0.6.0", default-features = false }

# ==========================================
# Hardware Logging & Panic Handling
# ==========================================
defmt = "0.3.5"
defmt-rtt = "0.4.0"
panic-probe = { version = "0.3.1", features = ["print-defmt"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
embedded-alloc = "0.5.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"